name: CI/CD Cloudflare Worker

on:
  pull_request:
  push:
    branches: [beta]

jobs:


  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      NEXT_PUBLIC_EMAIL_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAIL_PUBLIC_KEY }}
      NEXT_PUBLIC_EMAIL_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAIL_SERVICE_ID }}
      NEXT_PUBLIC_EMAIL_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAIL_TEMPLATE_ID }}
      NEXT_PUBLIC_BLOGGER_API_KEY: ${{ secrets.NEXT_PUBLIC_BLOGGER_API_KEY }}
      NEXT_PUBLIC_BLOGGER_BLOG_ID: ${{ secrets.NEXT_PUBLIC_BLOGGER_BLOG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build:deploy
      - name: Push secrets to Worker
        run: |
          echo "$FB_PAGE_ACCESS_TOKEN"            | npx wrangler secret put FB_PAGE_ACCESS_TOKEN
          echo "$NEXT_PUBLIC_EMAIL_PUBLIC_KEY"    | npx wrangler secret put NEXT_PUBLIC_EMAIL_PUBLIC_KEY
          echo "$NEXT_PUBLIC_EMAIL_SERVICE_ID"    | npx wrangler secret put NEXT_PUBLIC_EMAIL_SERVICE_ID
          echo "$NEXT_PUBLIC_EMAIL_TEMPLATE_ID"   | npx wrangler secret put NEXT_PUBLIC_EMAIL_TEMPLATE_ID
          echo "$NEXT_PUBLIC_BLOGGER_API_KEY"     | npx wrangler secret put NEXT_PUBLIC_BLOGGER_API_KEY
          echo "$NEXT_PUBLIC_BLOGGER_BLOG_ID"     | npx wrangler secret put NEXT_PUBLIC_BLOGGER_BLOG_ID